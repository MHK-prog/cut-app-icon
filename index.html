<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>برش و تغییر اندازهٔ آیکون</title>

  <!-- تنظیمات PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8b5cf6">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0b10;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .card {
      background: #151520;
      border: 1px solid #33204e;
      border-radius: 18px;
      padding: 2rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    h2 {
      font-size: 1.25rem;
      color: #f1f1f5;
    }

    input[type="file"] {
      display: none;
    }

    .btn {
      background: #8b5cf6;
      color: #fff;
      padding: 10px 22px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      border: none;
      transition: background 0.2s, transform 0.1s;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover {
      background: #7c3aed;
    }

    .btn:active {
      transform: scale(0.98);
    }

    #download192,
    #download512 {
      display: none;
      background: #10b981;
    }

    #download192:hover,
    #download512:hover {
      background: #059669;
    }

    .download-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
    }

    canvas {
      max-width: 250px;
      max-height: 250px;
      width: 100%;
      display: none;
      border-radius: 4px;
      background: repeating-conic-gradient(#1e1e2d 0% 25%, #151520 0% 50%) 50% / 16px 16px;
    }

    #statusMessage {
      color: #c7c7d1;
      font-size: 0.9rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="card">
    <h2>برش و تغییر اندازهٔ آیکون</h2>

    <label class="btn" for="uploader">انتخاب تصویر</label>
    <input type="file" id="uploader" accept="image/*">

    <p id="statusMessage" role="status" aria-live="polite">برای شروع، یک تصویر انتخاب کنید.</p>
    <canvas id="canvas" aria-label="پیش‌نمایش آیکون با گوشه‌های گرد"></canvas>

    <div class="download-actions" aria-label="دانلود خروجی‌ها">
      <a id="download192" class="btn">دانلود ۱۹۲ × ۱۹۲</a>
      <a id="download512" class="btn">دانلود ۵۱۲ × ۵۱۲</a>
    </div>
  </main>

  <script>
    // ثبت سرویس ورکر برای کارکرد آفلاین
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }

    const uploader = document.getElementById('uploader');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusMessage = document.getElementById('statusMessage');
    const download192 = document.getElementById('download192');
    const download512 = document.getElementById('download512');
    let latestRequest = 0;

    function makeRoundedSquare(image, outputSize) {
      const output = document.createElement('canvas');
      output.width = outputSize;
      output.height = outputSize;

      const outputContext = output.getContext('2d');
      const radius = outputSize * 0.28;
      const sourceSize = Math.min(image.naturalWidth, image.naturalHeight);
      const sourceX = (image.naturalWidth - sourceSize) / 2;
      const sourceY = (image.naturalHeight - sourceSize) / 2;

      outputContext.beginPath();
      if (typeof outputContext.roundRect === 'function') {
        outputContext.roundRect(0, 0, outputSize, outputSize, radius);
      } else {
        outputContext.moveTo(radius, 0);
        outputContext.lineTo(outputSize - radius, 0);
        outputContext.quadraticCurveTo(outputSize, 0, outputSize, radius);
        outputContext.lineTo(outputSize, outputSize - radius);
        outputContext.quadraticCurveTo(outputSize, outputSize, outputSize - radius, outputSize);
        outputContext.lineTo(radius, outputSize);
        outputContext.quadraticCurveTo(0, outputSize, 0, outputSize - radius);
        outputContext.lineTo(0, radius);
        outputContext.quadraticCurveTo(0, 0, radius, 0);
      }
      outputContext.closePath();
      outputContext.clip();
      outputContext.drawImage(
        image,
        sourceX,
        sourceY,
        sourceSize,
        sourceSize,
        0,
        0,
        outputSize,
        outputSize
      );

      return output;
    }

    uploader.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const requestId = ++latestRequest;
      const imageUrl = URL.createObjectURL(file);
      const image = new Image();

      canvas.style.display = 'none';
      download192.style.display = 'none';
      download512.style.display = 'none';
      statusMessage.textContent = 'در حال آماده‌سازی تصویر…';

      image.onload = () => {
        try {
          if (requestId !== latestRequest) return;

          const output192 = makeRoundedSquare(image, 192);
          const output512 = makeRoundedSquare(image, 512);

          canvas.width = 512;
          canvas.height = 512;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(output512, 0, 0);

          download192.href = output192.toDataURL('image/png');
          download192.download = 'rounded-icon-192.png';
          download512.href = output512.toDataURL('image/png');
          download512.download = 'rounded-icon-512.png';

          canvas.style.display = 'block';
          download192.style.display = 'inline-block';
          download512.style.display = 'inline-block';
          statusMessage.textContent = 'هر دو خروجی آماده‌اند؛ اندازهٔ دلخواهتان را دانلود کنید.';
        } catch {
          statusMessage.textContent = 'ساخت خروجی تصویر ممکن نشد. لطفاً تصویر دیگری انتخاب کنید.';
        } finally {
          URL.revokeObjectURL(imageUrl);
        }
      };

      image.onerror = () => {
        URL.revokeObjectURL(imageUrl);
        if (requestId === latestRequest) {
          statusMessage.textContent = 'بارگذاری تصویر انجام نشد. لطفاً تصویر دیگری انتخاب کنید.';
        }
      };

      image.src = imageUrl;
      uploader.value = '';
    });
  </script>
</body>
</html>
